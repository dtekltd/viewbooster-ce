name: Build View Booster Server

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: "dtekltd/viewbooster"
          token: ${{ secrets.WORKFLOW_PAT }}
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Tag
        run: |
          git checkout ${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.0.1"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Build App
        working-directory: ./app
        run: |
          npm install
          npm run build
          cp -a dist/spa/* ../server/ui/spa/

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
          cache: true

      - name: Build Server
        run: |
          set -e
          cd server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./booster .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/booster:latest
